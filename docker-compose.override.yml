# Local dev overrides — hot reload, Adminer, volume mounts
# This file is merged automatically by `docker compose up`

services:
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    environment:
      - NODE_ENV=development

  backend:
    volumes:
      - ./backend:/app
    command: ["uv", "run", "uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  adminer:
    image: adminer:latest
    ports:
      - "8080:8080"
    depends_on:
      - db
